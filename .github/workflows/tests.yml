name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Check style and behavior
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Exercise all command-line examples
        run: |
          python examples/train.py --steps 3
          python examples/generate.py --tokens 5
          python examples/classify.py --steps 2
          python examples/instruct.py --steps 2
